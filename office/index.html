<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>机器人办公室</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234c8dff'/%3E%3Ccircle cx='12' cy='14' r='2.2' fill='white'/%3E%3Ccircle cx='20' cy='14' r='2.2' fill='white'/%3E%3Crect x='10' y='20' width='12' height='2.4' rx='1.2' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="scene"></div>
  <aside id="hud" class="hud" aria-live="polite">
    <h1>机器人办公室</h1>
    <p id="hud-time">正在获取状态…</p>
    <p id="hud-count">忙碌 0 · 空闲 0</p>
    <p class="hint">拖拽旋转 · 滚轮缩放</p>
  </aside>
  <noscript><p class="hud">需要启用 JavaScript 才能查看办公室。</p></noscript>
  <script type="module">
    import('./main.js').catch(() => {
      const node = document.getElementById('hud-time');
      if (node) node.textContent = '三维场景加载失败，请检查网络';
    });
  </script>
</body>
</html>
