<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>机器人办公室</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%238F59F9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="scene"></div>
  <header class="topbar panel">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <strong>机器人办公室</strong>
        <p><span id="clock">--:--</span> <span id="updated">正在获取状态…</span></p>
      </div>
    </div>
    <div class="seg" role="group" aria-label="时间">
      <button type="button" id="btn-day" class="on">日间</button>
      <button type="button" id="btn-night">夜间</button>
    </div>
    <button type="button" id="btn-building" class="ghost">大楼</button>
    <div id="tallies" class="tallies" aria-live="polite">
      <span class="dot work">工作 0</span>
      <span class="dot wait">等待 0</span>
      <span class="dot err">异常 0</span>
      <span class="dot idle">空闲 0</span>
    </div>
  </header>
  <nav class="floors panel" aria-label="楼层">
    <h2>楼层</h2>
    <button type="button" data-floor="3" class="on"><b>3F</b><span>办公</span></button>
    <button type="button" data-floor="2"><b>2F</b><span>阅览</span></button>
    <button type="button" data-floor="1"><b>1F</b><span>大堂</span></button>
  </nav>
  <aside class="roster panel" aria-live="polite">
    <h2 id="roster-title">3F · 本层机器人</h2>
    <ul id="roster"></ul>
  </aside>
  <p class="hint">拖拽旋转 · 滚轮缩放</p>
  <noscript><p class="panel hint-block">需要启用 JavaScript 才能查看办公室。</p></noscript>
  <script type="module">
    import('./main.js').catch(() => {
      const node = document.getElementById('updated');
      if (node) node.textContent = '三维场景加载失败，请检查网络';
    });
  </script>
</body>
</html>
